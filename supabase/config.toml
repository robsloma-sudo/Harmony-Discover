# Function gateway settings for the Harmony Discover DEV project.
# Endpoints verify user auth or worker-specific authentication themselves.
[functions.discover-voice-session]
verify_jwt = false

[functions.discover-api]
verify_jwt = false

[functions.discover-live-read]
verify_jwt = true

[functions.discover-enrichment-worker]
verify_jwt = false

# Partial evidence, step 4: checks the user's JWT itself (the gateway check would block CORS preflight).
[functions.discover-verify-read]
verify_jwt = false
