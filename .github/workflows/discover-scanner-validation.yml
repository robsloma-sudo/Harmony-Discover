name: Discover scanner validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "modules/discover-arkit/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/discover-scanner-validation.yml"
  push:
    branches:
      - release/scanner-settings-mainline-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-scanner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Export web build
        run: npm run build:web

      - name: Verify exported app
        run: test -s dist/index.html
