name: Discover scanner validation

on:
  pull_request:
    branches:
      - main
      - fix/async-live-barcode-recognition
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "modules/discover-arkit/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/discover-scanner-validation.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-scanner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check live reader Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/discover-live-read/index.ts

      - name: Smoke-test actual D-FINE WASM inference
        run: |
          node scripts/copy-ort-wasm.mjs
          node scripts/smoke-dfine-wasm-runtime.mjs

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run complete unit test suite
        run: npm run test:all

      - name: Export web build
        run: npm run build:web

      - name: Verify exported app
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/ort/ort-wasm-simd-threaded.wasm
          test -s dist/ort/ort-wasm-simd-threaded.mjs
          test -s dist/ort/ort.wasm.bundle.min.mjs
          test -s dist/ort/ort-loader.js
          test -s dist/models/dfine_seg_n_coco.onnx
          echo 'D-FINE model asset is present in the exported app.'
          echo '999b6ae8970461b9a2b4a50f6cf07df3f355b131698a3e5b56cd420fbea5de30  dist/models/dfine_seg_n_coco.onnx' | sha256sum --check
