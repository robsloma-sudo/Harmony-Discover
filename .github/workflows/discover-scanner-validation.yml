name: Discover scanner validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "modules/discover-arkit/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/discover-scanner-validation.yml"
  push:
    branches:
      - release/scanner-settings-mainline-2026-11-11
      - fix/spatial-frame-sync-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-scanner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check live reader Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/discover-live-read/index.ts

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run scanner unit tests
        run: npx vitest run tests/live-recognition-policy.test.ts tests/overlay-track-association.test.ts tests/spatial-bottle-tracker.test.ts tests/patch-motion-tracker.test.ts tests/tracked-bottle-registry.test.ts tests/mask-contour.test.ts tests/contour-geometry.test.ts tests/segmentation-engine.test.ts tests/dfine-seg-adapter.test.ts tests/dfine-seg-onnx-provider.test.ts tests/bottle-identity-gate.test.ts

      - name: Export web build
        run: npm run build:web

      - name: Verify exported app
        run: test -s dist/index.html
