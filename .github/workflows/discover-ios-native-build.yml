name: Discover iOS native build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "modules/discover-arkit/**"
      - "plugins/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/discover-ios-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-native-build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Verify ONNX Runtime framework-header workaround
        run: |
          grep -n -A 7 "Harmony Discover: ONNX Runtime quoted-framework-header runtime workaround" ios/Podfile
          grep -n "CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER.*NO" ios/Podfile

      - name: Compile iOS simulator target
        run: |
          workspace="ios/HarmonyDiscover.xcworkspace"
          test -d "$workspace"
          schemes="$(xcodebuild -list -json -workspace "$workspace" | /usr/bin/python3 -c 'import json,sys; print("\\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')"
          printf '%s\\n' "$schemes"
          printf '%s\\n' "$schemes" | grep -Fxq "HarmonyDiscover"
          xcodebuild \
            -workspace "$workspace" \
            -scheme HarmonyDiscover \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
