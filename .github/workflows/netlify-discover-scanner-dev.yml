name: Deploy Harmony Discover scanner DEV preview

on:
  push:
    branches:
      - release/scanner-settings-mainline-2026-11-11
      - integration/release-candidate-2026-11-12
    paths:
      - "app/**"
      - "src/**"
      - "modules/discover-arkit/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/netlify-discover-scanner-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-discover-scanner-dev-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 3c50b789-a7f5-4ed4-806e-e5e455924646
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://lqqmwqrffelgnbngrkep.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out isolated scanner release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment configuration
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Missing NETLIFY_AUTH_TOKEN secret"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY secret"; exit 1; }
          node -e "const u=process.env.EXPO_PUBLIC_SUPABASE_URL; new URL(u); if (!u.startsWith('https://')) process.exit(1); console.log('Discover DEV endpoint validated; publishable key is present.');"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build:web

      - name: Verify exported app
        run: test -s dist/index.html

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy isolated non-production preview to the confirmed Discover site
        run: netlify deploy --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --alias=discover-scanner-dev --dir=dist --no-build --message "Harmony Discover scanner DEV preview $GITHUB_SHA"
