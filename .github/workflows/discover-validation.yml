name: Discover development validation

on:
  push:
    branches:
      - discover-source-import-2026-11-10
      - marty-boston-security-hardening-2026-11-10
  pull_request:
    branches:
      - discover-source-import-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript validation
        run: npm run typecheck
      - name: Validate Discover DEV Edge Functions
        run: |
          deno check supabase/functions/discover-voice-session/index.ts
          deno check supabase/functions/discover-menu-read/index.ts
      - name: Run all unit tests
        run: npm run test:all
      - name: Export web preview
        run: npm run build:web
