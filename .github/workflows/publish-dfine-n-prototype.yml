name: Publish verified D-FINE N prototype asset

on:
  push:
    branches:
      - fix/spatial-frame-sync-2026-11-12
    paths:
      - '.github/workflows/publish-dfine-n-prototype.yml'

concurrency:
  group: dfine-seg-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current scanner branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.ref_name }}

      - name: Download previously parity-checked D-FINE N artifact
        uses: actions/download-artifact@v4
        with:
          name: dfine-seg-n-coco-onnx
          run-id: 43278057727
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: model-artifacts

      - name: Set up Python for actual ONNX graph inspection
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify checksum and inspect/execute actual ONNX graph
        run: |
          set -euo pipefail
          MODEL="model-artifacts/dfine_seg_n_coco.onnx"
          test -s "$MODEL"
          EXPECTED_SHA="$(awk '{print $1}' model-artifacts/dfine_seg_n_coco.onnx.sha256)"
          ACTUAL_SHA="$(sha256sum "$MODEL" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          python -m pip install --upgrade pip
          python -m pip install "onnx>=1.22.0" "onnxruntime>=1.21.1" numpy
          python - "$MODEL" "model-artifacts/dfine_seg_graph_contract.json" <<'PY'
          import json, sys
          import numpy as np
          import onnx
          import onnxruntime as ort
          from onnx import TensorProto

          model_path, output_path = sys.argv[1:3]
          model = onnx.load(model_path)
          onnx.checker.check_model(model)
          def describe(value):
              # ONNX Runtime NodeArg exposes shape/type directly; ONNX ValueInfoProto
              # exposes them under type.tensor_type. Support both representations.
              if hasattr(value.type, "tensor_type"):
                  t = value.type.tensor_type
                  shape = [d.dim_value if d.dim_value else (d.dim_param or None) for d in t.shape.dim]
                  element_type = TensorProto.DataType.Name(t.elem_type)
              else:
                  shape = list(value.shape)
                  element_type = str(value.type).removeprefix("tensor(").removesuffix(")")
              return {"name": value.name, "shape": shape, "element_type": element_type}
          session = ort.InferenceSession(model_path, providers=["CPUExecutionProvider"])
          inputs, outputs = session.get_inputs(), session.get_outputs()
          if len(inputs) != 1:
              raise SystemExit(f"Expected one input, got {[x.name for x in inputs]}")
          if inputs[0].name != "input":
              raise SystemExit(f"Unexpected input tensor name: {inputs[0].name}")
          names = [x.name for x in outputs]
          if names != ["labels", "boxes", "scores", "masks"]:
              raise SystemExit(f"Unexpected output tensor names: {names}")
          sample = np.zeros((1, 3, 640, 640), dtype=np.float32)
          values = session.run(None, {"input": sample})
          shapes = [list(x.shape) for x in values]
          if len(values) != 4 or shapes[0][0] != 1 or len(shapes[0]) != 2:
              raise SystemExit(f"Invalid labels shape: {shapes}")
          count = shapes[0][1]
          if shapes[1] != [1, count, 4] or shapes[2] != [1, count] or len(shapes[3]) != 4 or shapes[3][:2] != [1, count]:
              raise SystemExit(f"Output tensor shape mismatch: {shapes}")
          contract = {
            "graph_name": model.graph.name,
            "ir_version": model.ir_version,
            "opsets": [{"domain": x.domain, "version": x.version} for x in model.opset_import],
            "inputs": [describe(x) for x in inputs],
            "outputs": [describe(x) for x in outputs],
            "runtime_smoke_test": {
              "provider": "CPUExecutionProvider",
              "input_shape": list(sample.shape),
              "output_shapes": shapes,
              "output_names": names,
              "output_dtypes": [str(x.dtype) for x in values],
              "status": "passed"
            }
          }
          with open(output_path, "w") as f:
              json.dump(contract, f, indent=2)
              f.write("\\n")
          print(json.dumps(contract, indent=2))
          PY

      - name: Fetch matching upstream license notice
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(python -c 'import json; print(json.load(open("model-artifacts/dfine_seg_n_coco.metadata.json"))["upstream_commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/ArgoHA/D-FINE-seg.git .research/dfine-seg
          git -C .research/dfine-seg checkout "$UPSTREAM_SHA" -- LICENSE
          cp .research/dfine-seg/LICENSE model-artifacts/dfine-seg-upstream-LICENSE.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add ONNX Runtime Web and WASM build hook
        run: |
          set -euo pipefail
          npm install onnxruntime-web@latest --save-exact --package-lock-only --no-audit --no-fund
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['prebuild:web'] = 'node scripts/copy-ort-wasm.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --package-lock-only --no-audit --no-fund

      - name: Validate runtime, scanner tests, and web export
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npx vitest run tests/segmentation-engine.test.ts tests/dfine-seg-adapter.test.ts tests/dfine-seg-onnx-provider.test.ts
          npm run build:web
          test -s dist/index.html
          find public/ort -maxdepth 1 -name '*.wasm' -print -quit | grep -q .

      - name: Commit prototype model and runtime dependency
        run: |
          set -euo pipefail
          mkdir -p public/models
          cp model-artifacts/dfine_seg_n_coco.onnx public/models/
          cp model-artifacts/dfine_seg_n_coco.onnx.sha256 public/models/
          cp model-artifacts/dfine_seg_n_coco.metadata.json public/models/
          cp model-artifacts/dfine_seg_graph_contract.json public/models/
          cp model-artifacts/dfine-seg-upstream-LICENSE.txt public/models/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Prototype model and runtime dependency are already current."
          else
            git commit -m "chore(discover): add D-FINE N model and ONNX Runtime Web"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
