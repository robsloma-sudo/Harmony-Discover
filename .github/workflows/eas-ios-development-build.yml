name: Harmony Discover iOS development build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out Harmony Discover
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Expo token is available
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Align native dependencies with Expo SDK 52
        run: npx expo install expo-constants expo-linking @expo/vector-icons@~14.0.4 react-native@0.76.9

      - name: Verify Expo project
        run: npx expo-doctor
        env:
          CI: "1"

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Create and link Harmony Discover EAS project
        run: eas init --account rsloma --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"

      - name: Show linked EAS project
        run: |
          node -e "const c=require('./app.json'); console.log('EAS project ID:', c.expo?.extra?.eas?.projectId || 'NOT WRITTEN')"

      - name: Build native iOS development client
        run: eas build --profile development --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
