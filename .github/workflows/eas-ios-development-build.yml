name: Harmony Discover iOS development build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-discover-ios-development-build
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out Harmony Discover
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo-doctor
        env:
          CI: "1"

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build native iOS development client
        run: eas build --profile development --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
