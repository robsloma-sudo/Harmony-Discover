name: Deploy Harmony Discover to production Netlify site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-discover-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 3c50b789-a7f5-4ed4-806e-e5e455924646
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://lqqmwqrffelgnbngrkep.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment configuration
        run: |
          if [ "$NETLIFY_SITE_ID" != "3c50b789-a7f5-4ed4-806e-e5e455924646" ]; then
            echo "::error::Refusing to deploy: NETLIFY_SITE_ID is not the Harmony Discover production site."
            exit 1
          fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          node -e "const u=process.env.EXPO_PUBLIC_SUPABASE_URL; if (!u || !/^https?:\\/\\//.test(u)) process.exit(1); new URL(u); console.log('Discover DEV Supabase URL is valid; publishable key is present.');"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Expo web app with explicit Discover DEV environment
        run: npm run build:web

      - name: Verify web build output
        run: |
          test -s dist/index.html
          echo "Verified dist/index.html exists."

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy prebuilt output without running Netlify build
        run: netlify deploy --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --dir=dist --no-build --message "Harmony Discover main ${GITHUB_SHA}"
