name: Deploy Harmony Discover to production Netlify site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-discover-netlify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://lqqmwqrffelgnbngrkep.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run complete test suite
        run: npm run test:all

      - name: Build browser application
        run: npm run build:web

      - name: Verify web build output
        run: test -s dist/index.html

      - name: Upload verified web build
        uses: actions/upload-artifact@v4
        with:
          name: harmony-discover-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 3c50b789-a7f5-4ed4-806e-e5e455924646
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://lqqmwqrffelgnbngrkep.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment configuration
        run: |
          if [ "$NETLIFY_SITE_ID" != "3c50b789-a7f5-4ed4-806e-e5e455924646" ]; then
            echo "::error::Refusing to deploy: NETLIFY_SITE_ID is not the Harmony Discover production site."
            exit 1
          fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          node -e "const u=process.env.EXPO_PUBLIC_SUPABASE_URL; if (!u || !/^https?:\\/\\//.test(u)) process.exit(1); new URL(u); console.log('Discover DEV Supabase URL is valid; publishable key is present.');"

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: harmony-discover-web-dist
          path: dist

      - name: Verify downloaded web build
        run: test -s dist/index.html

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy prebuilt output without running Netlify build
        run: netlify deploy --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --dir=dist --no-build --message "Harmony Discover main ${GITHUB_SHA}"

  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'scanner/regression-fixture-phase2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 3c50b789-a7f5-4ed4-806e-e5e455924646
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Verify preview deployment configuration
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Missing NETLIFY_AUTH_TOKEN secret"; exit 1; }
          test "$NETLIFY_SITE_ID" = "3c50b789-a7f5-4ed4-806e-e5e455924646" || { echo "::error::Wrong Netlify site ID"; exit 1; }

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: harmony-discover-web-dist
          path: dist

      - name: Verify downloaded web build
        run: test -s dist/index.html

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy isolated pull-request preview
        run: netlify deploy --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --alias=discover-pr-${{ github.event.pull_request.number }} --dir=dist --no-build --message "Harmony Discover pull request ${{ github.event.pull_request.number }} ${GITHUB_SHA}"
