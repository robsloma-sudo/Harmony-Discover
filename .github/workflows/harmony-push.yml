
name: Harmony push
on:
  push:
    branches-ignore: [main, fix/scanner-on-main, feature/probably-guess]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push feature/probably-guess (no merge, no deploy)
        run: |
          set -euo pipefail
          if [ ! -f harmony-probably.zip ]; then echo "Zip not on this branch. Nothing done."; exit 0; fi
          unzip -o -q harmony-probably.zip -d "$RUNNER_TEMP/hp"
          HEAD_ID=226c978f3c3fcc960d372f79233552e58c3bcfdd
          git fetch "$RUNNER_TEMP/hp/probably-guess.bundle" refs/heads/fix/scanner-on-main:refs/remotes/bundle/fix
          [ "$(git rev-parse refs/remotes/bundle/fix)" = "$HEAD_ID" ] || { echo "Wrong update file"; exit 1; }
          git push origin refs/remotes/bundle/fix:refs/heads/feature/probably-guess
          echo "SUCCESS: feature/probably-guess is on GitHub at $HEAD_ID. Nothing merged, nothing deployed."
