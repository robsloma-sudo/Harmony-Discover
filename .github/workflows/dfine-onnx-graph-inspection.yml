name: Inspect D-FINE ONNX graph for native iOS feasibility

on:
  push:
    branches:
      - research/dfine-onnx-graph-inspection-2026-11-13
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dfine-onnx-graph-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ONNX inspection tooling
        run: python -m pip install --disable-pip-version-check onnx

      - name: Download pinned D-FINE model
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/robsloma-sudo/Harmony-Discover/a3b8b5c12fa73c5eb84b475aa82e9d2644564f7f/public/models/dfine_seg_n_coco.onnx" \
            --output /tmp/dfine_seg_n_coco.onnx
          sha256sum /tmp/dfine_seg_n_coco.onnx
          test "$(stat -c%s /tmp/dfine_seg_n_coco.onnx)" -gt 1000000

      - name: Validate and report graph contract
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          import onnx
          from onnx import shape_inference

          path = "/tmp/dfine_seg_n_coco.onnx"
          model = onnx.load(path, load_external_data=True)
          onnx.checker.check_model(model)
          inferred = shape_inference.infer_shapes(model)

          def dims(value_info):
              tensor = value_info.type.tensor_type
              result = []
              for dim in tensor.shape.dim:
                  result.append(dim.dim_value if dim.HasField("dim_value") else dim.dim_param or "?")
              return result

          graph = inferred.graph
          counts = Counter(f"{node.domain or 'ai.onnx'}::{node.op_type}" for node in graph.node)
          initializers = [{"name": item.name, "dims": list(item.dims), "data_type": item.data_type} for item in graph.initializer]
          report = {
              "ir_version": model.ir_version,
              "opsets": [{"domain": item.domain or "ai.onnx", "version": item.version} for item in model.opset_import],
              "inputs": [{"name": item.name, "dims": dims(item)} for item in graph.input if item.name not in {x.name for x in graph.initializer}],
              "outputs": [{"name": item.name, "dims": dims(item)} for item in graph.output],
              "node_count": len(graph.node),
              "operator_counts": dict(sorted(counts.items())),
              "custom_domains": sorted({node.domain for node in graph.node if node.domain and node.domain != "ai.onnx"}),
              "initializer_count": len(initializers),
              "largest_initializers": sorted(initializers, key=lambda item: __import__("math").prod(item["dims"]), reverse=True)[:15],
              "metadata": {item.key: item.value for item in model.metadata_props},
          }
          print(json.dumps(report, indent=2))
          PY

  probe-coreml:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ONNX Runtime
        run: python -m pip install --disable-pip-version-check onnxruntime numpy

      - name: Download pinned D-FINE model
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/robsloma-sudo/Harmony-Discover/a3b8b5c12fa73c5eb84b475aa82e9d2644564f7f/public/models/dfine_seg_n_coco.onnx" \
            --output /tmp/dfine_seg_n_coco.onnx
          shasum -a 256 /tmp/dfine_seg_n_coco.onnx

      - name: Probe CoreML partitioning and inference
        run: |
          python - <<'PY'
          import json
          import time
          import numpy as np
          import onnxruntime as ort

          model = "/tmp/dfine_seg_n_coco.onnx"
          available = ort.get_available_providers()
          print("Available providers:", available)
          if "CoreMLExecutionProvider" not in available:
              raise SystemExit("CoreMLExecutionProvider is not present in this ONNX Runtime build")

          options = ort.SessionOptions()
          options.log_severity_level = 0
          options.log_verbosity_level = 1
          options.enable_profiling = True
          started = time.perf_counter()
          session = ort.InferenceSession(
              model,
              sess_options=options,
              providers=[
                  ("CoreMLExecutionProvider", {
                      "ModelFormat": "MLProgram",
                      "MLComputeUnits": "ALL",
                      "RequireStaticInputShapes": "1",
                  }),
                  "CPUExecutionProvider",
              ],
          )
          load_ms = (time.perf_counter() - started) * 1000
          print("Session providers:", session.get_providers())
          print("Input:", session.get_inputs()[0].name, session.get_inputs()[0].shape, session.get_inputs()[0].type)
          print("Outputs:", [{"name": x.name, "shape": x.shape, "type": x.type} for x in session.get_outputs()])
          input_name = session.get_inputs()[0].name
          sample = np.zeros((1, 3, 640, 640), dtype=np.float32)
          started = time.perf_counter()
          outputs = session.run(None, {input_name: sample})
          first_inference_ms = (time.perf_counter() - started) * 1000
          for _ in range(3):
              session.run(None, {input_name: sample})
          timings = []
          for _ in range(10):
              started = time.perf_counter()
              outputs = session.run(None, {input_name: sample})
              timings.append((time.perf_counter() - started) * 1000)
          profile_path = session.end_profiling()
          with open(profile_path, encoding="utf-8") as profile_file:
              events = json.load(profile_file)
          node_events = [event for event in events if event.get("cat") == "Node" and event.get("ph") == "X"]
          provider_counts = {}
          for event in node_events:
              provider = event.get("args", {}).get("provider", "unknown")
              provider_counts[provider] = provider_counts.get(provider, 0) + 1
          ordered = sorted(timings)
          p50 = ordered[len(ordered) // 2]
          p95 = ordered[min(len(ordered) - 1, int(len(ordered) * 0.95))]
          print(json.dumps({
              "session_load_ms": round(load_ms, 2),
              "first_inference_ms": round(first_inference_ms, 2),
              "steady_state_ms": [round(value, 2) for value in timings],
              "steady_state_p50_ms": round(p50, 2),
              "steady_state_p95_ms": round(p95, 2),
              "output_shapes": [list(x.shape) for x in outputs],
              "provider_order": session.get_providers(),
              "node_events_by_provider": provider_counts,
              "profile_path": profile_path,
          }, indent=2))
          PY
